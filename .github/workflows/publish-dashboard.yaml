name: Publish Dashboard to Cloudflare Pages
env:
  PUBLIC_APEX_DOMAIN: ${{ vars.PUBLIC_APEX_DOMAIN }}
  MAIN_BRANCH: main
  BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
  GITHUB_LINK: ${{ github.event_name == 'pull_request_target' && format('https://github.com/{0}/pull/{1}', github.repository, github.event.pull_request.number) || format('https://github.com/{0}/tree/{1}', github.repository, github.event.pull_request.head.ref || github.ref_name) }}
  COMMIT_URL: ${{ github.event_name == 'pull_request_target' && format('https://github.com/{0}/pull/{1}/commits/{2}', github.repository, github.event.pull_request.number, github.sha) || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    name: Publish to Cloudflare Pages
    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        persist-credentials: false
    - name: GERALT debug probe
      run: |
        printf '%s\n' 'GERALT_DBG source checkpoint: HEAD state before git-commit-data-action'
        if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          printf 'GERALT_DBG HEAD sha: %s\n' "$(git rev-parse HEAD 2>/dev/null || printf '%s' '<unavailable>')"
          printf 'GERALT_DBG raw HEAD commit subject: %s\n' "$(git log -1 --pretty=format:%s 2>/dev/null || printf '%s' '<unavailable>')"
        else
          printf '%s\n' 'GERALT_DBG no git work tree available'
        fi
        printf '%s\n' 'GERALT_DBG end source checkpoint'
      continue-on-error: true
    - name: Expose git commit data
      uses: rlespinasse/git-commit-data-action@v1.5.0
    - name: Publish to Cloudflare Pages
      id: deployment
      run: |
        mkdir -p .cf-pages-stub
        printf '%s\n' 'pages-deployment-alias-url=https://stub.pages.dev' >> "$GITHUB_OUTPUT"
        printf '%s\n' 'deployment-url=https://stub.pages.dev' >> "$GITHUB_OUTPUT"
        printf '%s\n' 'deployment-alias-url=https://stub.pages.dev' >> "$GITHUB_OUTPUT"
    - name: GERALT debug probe
      run: |
        printf '%s\n' 'GERALT_DBG sink checkpoint: Discord args template-eval state'
        printf 'GERALT_DBG runtime GIT_COMMIT_MESSAGE_SUBJECT=%s\n' "$(printenv GIT_COMMIT_MESSAGE_SUBJECT 2>/dev/null || printf '%s' '<unset>')"
        printf 'GERALT_DBG runtime BRANCH_NAME=%s\n' "$(printenv BRANCH_NAME 2>/dev/null || printf '%s' '<unset>')"
        gitc=${{ toJSON(env.GIT_COMMIT_MESSAGE_SUBJECT) }}
        printf 'GERALT_DBG env-context GIT_COMMIT_MESSAGE_SUBJECT=%s\n' "$gitc"
        brn=${{ toJSON(env.BRANCH_NAME) }}
        printf 'GERALT_DBG env-context BRANCH_NAME=%s\n' "$brn"
        if printenv DISCORD_WEBHOOK >/dev/null 2>&1; then
          printf '%s\n' 'GERALT_DBG DISCORD_WEBHOOK=set'
        else
          printf '%s\n' 'GERALT_DBG DISCORD_WEBHOOK=unset'
        fi
        printf '%s\n' 'GERALT_DBG end sink checkpoint'
      continue-on-error: true
    - name: Discord feature branch notification
      if: github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref_name != env.MAIN_BRANCH)
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      uses: Ilshidur/action-discord@master
      with:
        args: '**DASHBOARD PREVIEW** ${{ steps.deployment.outputs.pages-deployment-alias-url }} was generated by ${{ github.actor }} in [${{ env.GIT_COMMIT_SHORT_SHA }}](${{ env.COMMIT_URL }}) on [${{ github.repository}}@${{ env.BRANCH_NAME }}](${{ env.GITHUB_LINK }}) with memo `${{ env.GIT_COMMIT_MESSAGE_SUBJECT }}`'
on:
  push:
    paths:
    - .github/workflows/publish-dashboard.yaml
    - packages/dashboard/**
    - package.json
    - pnpm-lock.yaml
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - .github/workflows/publish-dashboard.yaml
    - packages/dashboard/**
    - package.json
    - pnpm-lock.yaml
