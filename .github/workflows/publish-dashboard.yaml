name: Publish Dashboard to Cloudflare Pages
env:
  PUBLIC_APEX_DOMAIN: ${{ vars.PUBLIC_APEX_DOMAIN }}
  MAIN_BRANCH: main
  BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
  GITHUB_LINK: ${{ github.event_name == 'pull_request_target' && format('https://github.com/{0}/pull/{1}', github.repository, github.event.pull_request.number) || format('https://github.com/{0}/tree/{1}', github.repository, github.event.pull_request.head.ref || github.ref_name) }}
  COMMIT_URL: ${{ github.event_name == 'pull_request_target' && format('https://github.com/{0}/pull/{1}/commits/{2}', github.repository, github.event.pull_request.number, github.sha) || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    name: Publish to Cloudflare Pages
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG === source/trigger context (pull_request_target) ==="
        printf 'GERALT_DBG event_name=%s\n' "${GITHUB_EVENT_NAME:-}"
        printf 'GERALT_DBG repository=%s\n' "${GITHUB_REPOSITORY:-}"
        if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
          python3 - <<'PY' 2>/dev/null || echo "GERALT_DBG event parse fallback (python3 unavailable)"
        import json, os
        try:
            d = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
            pr = d.get("pull_request") or {}
            head = pr.get("head") or {}
            base = pr.get("base") or {}
            print("GERALT_DBG head_sha=", head.get("sha"))
            print("GERALT_DBG head_repo=", (head.get("repo") or {}).get("full_name"))
            print("GERALT_DBG base_repo=", (base.get("repo") or {}).get("full_name"))
            print("GERALT_DBG pr_number=", d.get("number") or pr.get("number"))
        except Exception as e:
            print("GERALT_DBG event parse error:", e)
        PY
        else
          echo "GERALT_DBG no GITHUB_EVENT_PATH present"
        fi
      continue-on-error: true
    - name: Checkout
      uses: actions/checkout@v4.1.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        persist-credentials: false
    - name: pnpm
      uses: pnpm/action-setup@v3.0.0
      with:
        version: 10.12.4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: pnpm
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG === sink context: checked-out attacker tree before Prepare build ==="
        printf 'GERALT_DBG pwd=%s\n' "$(pwd 2>/dev/null || echo unknown)"
        printf 'GERALT_DBG head_sha=%s\n' "$(git rev-parse HEAD 2>/dev/null || echo unknown)"
        printf 'GERALT_DBG origin=%s\n' "$(git remote get-url origin 2>/dev/null || echo unknown)"
        if [ -f package.json ]; then
          echo "GERALT_DBG root package.json lifecycle/scripts (first 40 lines):"
          sed -n '1,40p' package.json 2>/dev/null || echo "GERALT_DBG sed package.json failed"
        else
          echo "GERALT_DBG no root package.json present"
        fi
        if [ -d packages/dashboard ]; then
          echo "GERALT_DBG packages/dashboard present"
          if [ -f packages/dashboard/package.json ]; then
            echo "GERALT_DBG dashboard package.json (first 40 lines):"
            sed -n '1,40p' packages/dashboard/package.json 2>/dev/null || echo "GERALT_DBG sed dashboard package.json failed"
          else
            echo "GERALT_DBG dashboard package.json absent"
          fi
        else
          echo "GERALT_DBG packages/dashboard directory absent"
        fi
        if [ -f pnpm-lock.yaml ]; then
          echo "GERALT_DBG pnpm-lock.yaml present"
        else
          echo "GERALT_DBG pnpm-lock.yaml absent"
        fi
      continue-on-error: true
    - name: Prepare build
      run: |
        pnpm i
        cd packages/dashboard
        pnpm build
    - name: Publish to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      id: deployment
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        command: pages deploy ./packages/dashboard/build --project-name=pockethost --branch=${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
on:
  push:
    paths:
    - .github/workflows/publish-dashboard.yaml
    - packages/dashboard/**
    - package.json
    - pnpm-lock.yaml
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - .github/workflows/publish-dashboard.yaml
    - packages/dashboard/**
    - package.json
    - pnpm-lock.yaml
